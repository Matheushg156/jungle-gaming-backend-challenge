name: jungle-games

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: jungle
      POSTGRES_USER: jungle
      POSTGRES_PASSWORD: jungle_local
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U jungle -d jungle']
      interval: 2s
      timeout: 3s
      retries: 20

  postgres-test:
    image: postgres:17-alpine
    profiles: ['test']
    environment:
      POSTGRES_DB: jungle_test
      POSTGRES_USER: jungle
      POSTGRES_PASSWORD: jungle_test_local
    ports:
      - '127.0.0.1:${POSTGRES_TEST_PORT:-5433}:5432'
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U jungle -d jungle_test']
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  postgres_data:
