name: jungle-games

services:
  localstack:
    image: localstack/localstack:4.0.3
    environment:
      SERVICES: sqs
      AWS_DEFAULT_REGION: us-east-1
      SQS_ENDPOINT_STRATEGY: path
    ports:
      - '127.0.0.1:${LOCALSTACK_PORT:-4566}:4566'
    volumes:
      - ./docker/localstack/ready.sh:/etc/localstack/init/ready.d/ready.sh:ro
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'awslocal sqs get-queue-url --queue-name wager-events.fifo > /dev/null',
        ]
      interval: 2s
      timeout: 5s
      retries: 60

  localstack-test:
    image: localstack/localstack:4.0.3
    profiles: ['test']
    environment:
      SERVICES: sqs
      AWS_DEFAULT_REGION: us-east-1
      SQS_ENDPOINT_STRATEGY: path
    ports:
      - '127.0.0.1:${LOCALSTACK_TEST_PORT:-4567}:4566'
    healthcheck:
      test: ['CMD-SHELL', 'awslocal sqs list-queues > /dev/null']
      interval: 2s
      timeout: 5s
      retries: 60
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: jungle
      POSTGRES_USER: jungle
      POSTGRES_PASSWORD: jungle_local
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U jungle -d jungle']
      interval: 2s
      timeout: 3s
      retries: 20

  postgres-test:
    image: postgres:17-alpine
    profiles: ['test']
    environment:
      POSTGRES_DB: jungle_test
      POSTGRES_USER: jungle
      POSTGRES_PASSWORD: jungle_test_local
    ports:
      - '127.0.0.1:${POSTGRES_TEST_PORT:-5433}:5432'
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U jungle -d jungle_test']
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  postgres_data:
